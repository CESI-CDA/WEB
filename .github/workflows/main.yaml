name: Deploy React App

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Raspberry

    steps:
      # Étape 1 : Checkout du code source
      - name: Checkout repository
        uses: actions/checkout@v2

      # Étape 2 : Construction de l'image Docker
      - name: Build Dockerfile
        run: docker build -t web-front .

      # Étape 3 : Sauvegarder l'image Docker en fichier tar
      - name: Save the Docker image as a tar file
        run: docker save -o web-front.tar web-front

      # Étape 4 : Upload de l'image Docker comme artefact
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-image
          path: web-front.tar

  deploy-on-server:
    needs: [build]
    runs-on: ubuntu-latest
    environment: Raspberry

    steps:
      # Étape 5 : Télécharger l'image Docker depuis l'artefact
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: build-image
          path: web-front.tar

      # Étape 6 : Configuration de la connexion SSH avec clé privée
      - name: Setup SSH for connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ssh-keyscan ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # Étape 7 : Transférer l'image Docker vers le serveur
      - name: Transfer Docker image via SCP
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: web-front.tar
          target: "/var/www/html/Cube-Front"

      # Étape 8 : Charger et démarrer le conteneur Docker sur le serveur
      - name: Run Docker container on server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/html/Cube-Front/
            docker load -i web-front.tar
            docker run -d --name web-front-container -p 80:80 web-front
