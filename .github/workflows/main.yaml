name: Deploy React App

on:
  push:
    branches:
      - develop
  pull_request:
      types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Raspberry

    steps:
      # Étape 1 : Checkout du code source
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: build dockerfile
        run: docker build -t cube-front .
        
      - name: stocker-build
        uses: actions/upload-artifact@v4
        with:
          name: build-image
          path: cube-front
          
  run-sonar:
    needs: build
    runs-on: ubuntu-latest
    environment: Raspberry
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  deploy-on-erver:
    needs: [build, run-sonar]
    runs-on: ubuntu-latest
    environment: Raspberry
    steps:
      - name: download-build
        uses: actions/download-artifact@v4
        with:
          name: build-image
          path: cube-front
    # Étape 5 : Transférer les fichiers vers le serveur via SSH (avec mot de passe)
      - name: send image via SSH
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: build-image
          target: "/var/www/html/Cube-Front"
          
      - name: run the conteneur
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            docker load -i /var/www/html/Cube-Front/cube-front
            docker stop cube-front || true
            docker rm my-cube-front || true
            docker run -d -p 80 --name cube-front cube-front

    # Étape 6 : Redémarrer le serveur Apache (si nécessaire)
      - name: Restart Apache server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: sudo systemctl restart apache2
