name: Deploy React App

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Raspberry
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Build Docker image
        run: docker build -t web-front .

      - name: Save Docker image as a tar file
        run: docker save -o web-front.tar web-front

      # Ajoute une étape pour vérifier que le fichier .tar est généré avec succès
      - name: Verify Docker image tar file
        run: ls -lh web-front.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-image
          path: web-front.tar

  deploy-on-server:
    needs: [build]
    runs-on: ubuntu-latest
    environment: Raspberry
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: build-image
          path: web-front.tar

      - name: Verify downloaded tar file
        run: ls -lh web-front.tar

      - name: Setup SSH for connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ssh-keyscan ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Transfer Docker image via SCP without compression
        uses: appleboy/scp-action@v0.1.3
        with:
         host: ${{ secrets.SSH_HOST }}
         username: ${{ secrets.SSH_USER }}
         key: ${{ secrets.SSH_PRIVATE_KEY }}
         source: web-front.tar
         target: "/var/www/html/Cube-Front"
         scp-options: "-o Compression=no"


      # Vérifie que le fichier est bien transféré et qu'il a la bonne taille sur le serveur
      - name: Verify transferred tar file on server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: ls -lh /var/www/html/Cube-Front/web-front.tar

      - name: Load Docker image on server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/html/Cube-Front/
            docker load -i /web-front.tar

      # Ajoute une vérification après le chargement de l'image pour s'assurer qu'elle est bien présente
      - name: Verify Docker image on server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: docker images

      - name: Run Docker container
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker run -d --name web-front-container -p 80:80 web-front
