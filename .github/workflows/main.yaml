name: Deploy React App

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Raspberry
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Build Docker image
        run: docker build -t web-front .

      - name: Save Docker image as a tar file
        run: docker save -o web-front.tar web-front

      # Vérifier que le fichier .tar est bien généré
      - name: Verify Docker image tar file
        run: |
          ls -lh web-front.tar
          file web-front.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-image
          path: web-front.tar

  deploy-on-server:
    needs: [build]
    runs-on: ubuntu-latest
    environment: Raspberry
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: build-image
          path: web-front.tar

      - name: Verify downloaded tar file
        run: |
          ls -lh web-front.tar
          file web-front.tar

      - name: Setup SSH for connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ssh-keyscan ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Transfer Docker image via SCP
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username:
