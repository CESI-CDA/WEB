name: Deploy React App to Docker Hub

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Cloner le dépôt
      - name: Checkout repository
        uses: actions/checkout@v2

      # 2. Connexion à Docker Hub avec les informations d'identification stockées dans les secrets
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 3. Construire l'image Docker
      - name: Build Docker image
        run: docker build --platform linux/arm64 -t ${{ secrets.DOCKER_USERNAME }}/web-front:latest .

      # 4. Pousser l'image Docker sur Docker Hub
      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/web-front:latest

  deploy-on-server:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment: Raspberry
    steps:
      # 1. Configurer la connexion SSH avec la clé privée
      - name: Setup SSH for connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # 2. Se connecter au serveur, tirer l'image Docker depuis Docker Hub et la lancer
      - name: Pull Docker image and run on server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"
            docker pull ${{ secrets.DOCKER_USERNAME }}/web-front:latest
            docker stop web-front-container || true
            docker rm web-front-container || true
            docker run -d --name web-front-container -p 8443:80 ${{ secrets.DOCKER_USERNAME }}/web-front:latest
