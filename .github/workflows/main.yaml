name: Deploy React App

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Raspberry
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Build Docker image
        run: docker build -t web-front .

      - name: Save Docker image as a tar file
        run: docker save -o web-front.tar web-front

      # Ajoute une étape pour vérifier que le fichier .tar est généré avec succès
      - name: Verify Docker image tar file
        run: |
          ls -lh web-front.tar
          file web-front.tar

      # Compresser le fichier .tar avant de le transférer pour éviter la corruption
      - name: Compress tar file
        run: tar -czvf web-front.tar.gz web-front.tar

      # Upload du fichier compressé en tant qu'artefact
      - name: Upload compressed Docker image artifact
        uses: actions/upload-artifact@v2
        with:
          name: build-image-compressed
          path: web-front.tar.gz

  deploy-on-server:
    needs: [build]
    runs-on: ubuntu-latest
    environment: Raspberry
    steps:
      - name: Download compressed artifact
        uses: actions/download-artifact@v4
        with:
          name: build-image-compressed
          path: web-front.tar.gz

      # Vérification que le fichier compressé a bien été téléchargé
      - name: Verify downloaded compressed tar file
        run: |
          ls -lh web-front.tar.gz
          file web-front.tar.gz

      - name: Setup SSH for connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ssh-keyscan ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # Transfert du fichier compressé via SCP vers le serveur
      - name: Transfer compressed tar file via SCP
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: web-front.tar.gz
          target: "/var/www/html/Cube-Front"

      # Vérifier que le fichier compressé est bien transféré sur le serveur
      - name: Verify transferred compressed tar file on server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            ls -lh /var/www/html/Cube-Front/web-front.tar.gz
            file /var/www/html/Cube-Front/web-front.tar.gz

      # Décompresser le fichier sur le serveur
      - name: Decompress tar file on server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/html/Cube-Front/
            tar -xzvf web-front.tar.gz

      # Vérifier que le fichier .tar est bien décompressé sur le serveur
      - name: Verify decompressed tar file on server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            ls -lh /var/www/html/Cube-Front/web-front.tar
            file /var/www/html/Cube-Front/web-front.tar

      # Charger l'image Docker à partir du fichier .tar décompressé
      - name: Load Docker image on server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/html/Cube-Front/
            docker load -i web-front.tar

      # Vérifier que l'image Docker est bien chargée
      - name: Verify Docker image on server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: docker images

      # Lancer le conteneur Docker
      - name: Run Docker container
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker run -d --name web-front-container -p 80:80 web-front
